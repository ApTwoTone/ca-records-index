name: rabbit-ain
# Rabbit netr_read AIN proof: pairs are "AIN:DOCNO"; the walk and stop rules are in rabbit_ain.py.
on:
  workflow_dispatch:
    inputs:
      pairs: { required: true, type: string }
      shards: { required: false, type: string, default: "10" }

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        env:
          PAIRS: ${{ inputs.pairs }}
          SHARDS: ${{ inputs.shards }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          pairs = list(dict.fromkeys(os.environ["PAIRS"].replace(",", " ").split()))
          n = max(1, min(int(os.environ["SHARDS"]), len(pairs)))
          print("matrix=" + json.dumps({"include": [{"i": i, "pairs": " ".join(pairs[i::n])} for i in range(n)]}))
          PY

  prove:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet curl_cffi
      - name: walk AINs for shard ${{ matrix.i }}
        env:
          PAIRS: ${{ matrix.pairs }}
          NAME_SALT: ${{ secrets.NAME_SALT }}
        run: |
          echo "$PAIRS" > pairs.txt
          python3 rabbit_ain.py pairs.txt out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rabbit-ain-${{ matrix.i }}
          path: out/
          retention-days: 3
