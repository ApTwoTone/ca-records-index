name: index-probe
# SIDE BRANCH ONLY — probe/page-routes-20260903
# Bounded fleet probe of non-thumb NETR page routes. Does not harvest,
# does not mint, does not advance the watermark. Production pin is
# heads/codex/netr-runtime-20260712 and is not moved by this branch.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard: "0"
            family: canary
          - shard: "1"
            family: alt_a
          - shard: "2"
            family: alt_b
          - shard: "3"
            family: alt_c
          - shard: "4"
            family: second_doc
          - shard: "5"
            family: worker
    steps:
      - uses: actions/checkout@v4
      - name: run bounded page-route probe
        env:
          NETR_PROXY_KEY: ${{ secrets.NETR_PROXY_KEY }}
          PROBE_FAMILY: ${{ matrix.family }}
          PROBE_SHARD: ${{ matrix.shard }}
          PROBE_OUT: out
          PROBE_DOC_LIVE: "20260599849"
          PROBE_DOC_INDEX: "20260448794"
        run: |
          mkdir -p out
          python3 page_route_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-route-probe-${{ matrix.shard }}-${{ matrix.family }}
          path: out/
          retention-days: 14
          if-no-files-found: warn
